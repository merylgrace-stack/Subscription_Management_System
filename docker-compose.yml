version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: brightloop_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brightloop_db}
      POSTGRES_USER: ${POSTGRES_USER:-brightloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: brightloop_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python seed_data.py &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-brightloop-super-secure-production-key-2026}
      POSTGRES_DB: ${POSTGRES_DB:-brightloop_db}
      POSTGRES_USER: ${POSTGRES_USER:-brightloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop_secure_pass_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-brightloop-super-secure-production-key-2026}
      POSTGRES_DB: ${POSTGRES_DB:-brightloop_db}
      POSTGRES_USER: ${POSTGRES_USER:-brightloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop_secure_pass_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-brightloop-super-secure-production-key-2026}
      POSTGRES_DB: ${POSTGRES_DB:-brightloop_db}
      POSTGRES_USER: ${POSTGRES_USER:-brightloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop_secure_pass_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brightloop_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
